name: Build releases
on:
  push:
    branches: ['hoplite/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 xvfb
      - run: python -m pip install -r packaging/requirements-build.txt
      - name: Unit and offscreen UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --noconfirm packaging/LessonListener.spec
      - name: Smoke test frozen Linux app
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/LessonListener/LessonListener --smoke-test
      - name: Smoke test frozen Windows app
        timeout-minutes: 2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath dist/LessonListener.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Frozen application failed: $($p.ExitCode)" }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python packaging/build_linux.py --skip-freeze
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/LessonListener.exe release/LessonListener-1.1.0-beta.1-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: release/*
          if-no-files-found: error
  android:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android lint and installable preview APK
        working-directory: android
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/LessonListener-1.1.0-beta.1-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk
          if-no-files-found: error
